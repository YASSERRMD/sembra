[package]
name = "sembra-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
sembra-types = { version = "0.1.0", path = "../sembra-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
