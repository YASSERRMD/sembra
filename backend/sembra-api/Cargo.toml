[package]
name = "sembra-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sembra-api"
path = "src/main.rs"

[dependencies]
sembra-core = { path = "../sembra-core" }
sembra-cache = { path = "../sembra-cache" }
sembra-storage = { path = "../sembra-storage" }
sembra-graph = { path = "../sembra-graph" }
sembra-types = { path = "../sembra-types" }

# Web framework
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
config = "0.14"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Security
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
chrono = "0.4"
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }

# File Upload & Extraction
multer = "3"
pdf-extract = "0.7"
docx-rs = "0.4"
futures = "0.3"
bytes = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

